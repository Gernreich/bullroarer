name: Pre-cut gate

# The cut files are the deliverable, so they are checked the way a build repository
# checks its nets: geometry measured, not drawing read. flat-part-check lives in
# lasermade-tools because every repository here uses it, so the run needs both
# checkouts. It exits non-zero on any failure, which turns the run red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cut-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Gernreich/lasermade-tools
          path: .tools
      # flat-part-check is Rust since 2026-11-07; the runner image has cargo
      - name: Build the gate
        run: cargo build --release --locked --bin flat-part-check --manifest-path .tools/Cargo.toml
      - name: Check every cut file
        run: .tools/target/release/flat-part-check --dir .
