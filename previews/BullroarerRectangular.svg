<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="42.127mm" viewBox="0 0 200 42.127">
<!-- DISPLAY ONLY - not a cut file.
     The stroke is thickened, a light ground painted in, and the lightest inks
     darkened: green, cyan and orange sit below the 3:1 graphics minimum against any
     light background, so the cut order cannot be read from a faithful rendering. Hue
     and sequence are unchanged. Geometry and sheet position are untouched, and the
     CUT FILE keeps the exact values your laser keys on.
     Cut the file in the repository root, not this one. -->
  <rect x="0.0" y="0.0" width="200.0" height="42.127" fill="#ffffff"/>
<title>Bullroarer, rectangular</title>
<desc>1 user unit = 1mm. A bullroarer blade, rectangular, drawn by bullroarer.rs --blade=rectangular. Cut it in 3mm Baltic birch, face grain along the blade. Green #00ff00 cuts the cord hole first, then black #000000 frees the blade.</desc>
  <g fill="none" stroke="#0a7a12" stroke-width="0.400">
    <circle cx="189.4167" cy="21.0635" r="3.5"/>
  </g>
  <g fill="none" stroke="#000000" stroke-width="0.400">
    <path d="M 0,0 L 200,0 L 200,42.127 L 0,42.127 L 0,0 Z"/>
  </g>
</svg>
